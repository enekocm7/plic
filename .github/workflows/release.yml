name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Check the tag matches Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            Write-Error "Tag $tag does not match the Cargo.toml version $version"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: cargo build --release --locked

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dist = "target\dist"
          New-Item -ItemType Directory -Force $dist | Out-Null

          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" installer\plic.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $portable = "$dist\plic-$version-windows-x64"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item target\release\plic.exe, README.md, LICENSE $portable
          Compress-Archive -Path "$portable\*" -DestinationPath "$portable.zip" -Force
          Remove-Item -Recurse $portable

          # winget and Scoop manifests for this release, from packaging/.
          pwsh packaging/render-manifests.ps1 -Version $version `
            -Installer "$dist\plic-$version-setup.exe" -Zip "$portable.zip" `
            -OutDir target\manifests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path target\manifests\* -DestinationPath "$dist\plic-$version-manifests.zip" -Force

          Push-Location $dist
          Get-ChildItem -File -Exclude SHA256SUMS.txt | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Pop-Location

      - name: Keep the manifests for the next jobs
        uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: target/manifests

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem target\dist -File).FullName `
            --title "plic ${{ steps.version.outputs.version }}" `
            --generate-notes `
            --verify-tag

  winget:
    name: Submit to winget
    needs: windows
    runs-on: windows-latest
    # Needs a classic GitHub token with public_repo scope in the WINGET_TOKEN
    # secret; without one the job explains what to do and stops.
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests

      - name: Open a pull request on microsoft/winget-pkgs
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Output "::notice::WINGET_TOKEN is not set; the winget manifests are attached to the release for submitting by hand."
            exit 0
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $manifest = Get-ChildItem manifests/winget/enekocm7.plic -Directory | Select-Object -First 1
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN $manifest.FullName

  scoop:
    name: Update the Scoop bucket
    needs: windows
    runs-on: ubuntu-latest
    # The bucket lives in this repository, so `scoop bucket add plic
    # https://github.com/enekocm7/plic` serves the latest release.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: manifests

      - name: Commit bucket/plic.json
        run: |
          mkdir -p bucket
          cp manifests/scoop/plic.json bucket/plic.json
          git add bucket/plic.json
          if git diff --cached --quiet; then
            echo "The bucket is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the Scoop manifest to ${GITHUB_REF_NAME}"
          git push origin HEAD:master
