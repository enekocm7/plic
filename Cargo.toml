[package]
name = "plic"
version = "0.8.0"
edition = "2024"
description = "Watch, trim and file away video clips"

[dependencies]
anyhow = "1.0.104"
cpal = "0.17.3"
futures = "0.3"
gpui-kit = { version = "0.9.0", features = ["gpui-fast"] }
image = { version = "0.25", default-features = false }
open = "5.4.4"
rtrb = "0.3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
trash = "5.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# GPUI is large: build dependencies with parallel codegen even in release.
[profile.release.package."*"]
codegen-units = 16

# Keep debug builds responsive; layout and painting are hot paths.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"
